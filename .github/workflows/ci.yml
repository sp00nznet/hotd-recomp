# What CI can check without the game (which is never in the repo): the Python
# tools compile, the lifter's and the disassembler's self-tests pass, and the
# host compiles for x86 with warnings as errors. Linking needs the generated C,
# which only a local run of the pipeline on your own copy produces.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sp00nznet/pcrecomp
          path: pcrecomp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compiles
        run: python -m py_compile run_lift.py tools/seed_from_log.py
      - name: Lifter and disassembler self-tests
        run: |
          pip install capstone
          python pcrecomp/tools/lift/generate.py --selftest
          python pcrecomp/tools/disasm/disasm32.py --selftest
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: host compiles (x86, /W3 /WX)
        run: cl /nologo /c /W3 /WX /D_CRT_SECURE_NO_WARNINGS /Isrc/runtime /Ipcrecomp/runtime/native32 /Ipcrecomp/runtime/recomp32 src/runtime/host.c src/runtime/ddraw_window.c src/runtime/menu.c src/runtime/net.c
